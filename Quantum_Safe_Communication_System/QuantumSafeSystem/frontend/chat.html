<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumSafeSystem - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen w-full text-gray-900">

    <!-- Sidebar -->
    <div class="w-1/4 border-r border-gray-200 flex flex-col bg-white">
        <div class="p-6">
            <h2 class="text-xl font-bold">Contacts</h2>
        </div>
        <div class="flex-1 overflow-y-auto px-4 space-y-3">
            <div class="border border-green-800 bg-active-contact p-4 rounded cursor-pointer">
                <h3 class="font-bold text-gray-900">Aarav</h3>
                <p class="text-sm text-gray-600 mt-1">Session active</p>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="w-3/4 flex flex-col bg-cream">
        
        <!-- Header -->
        <div class="bg-white px-8 py-5 border-b border-gray-200 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">Aarav</h2>
                <p class="text-xs font-mono text-green-custom mt-1 tracking-wide uppercase">ML-KEM-768 + AES-256-GCM</p>
            </div>
            <a href="dashboard.html" class="text-green-custom text-sm underline hover:opacity-80 transition">Open security dashboard</a>
        </div>

        <!-- Messages Area -->
        <div class="flex-1 overflow-y-auto p-8 space-y-6 flex flex-col" id="chatContainer">
            <!-- Messages yahan dynamically aayenge -->
        </div>

        <!-- Input Area (Yahan File Input add kiya hai) -->
        <div class="bg-white px-6 py-5 border-t border-gray-200">
            <form id="chatForm" class="flex gap-4 items-center">
                <!-- File Input -->
                <input type="file" id="fileInput" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-[#2c5e43] hover:file:bg-green-100">
                
                <input type="text" id="messageInput" placeholder="Type a message" class="flex-1 px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#2c5e43]">
                <button type="submit" class="btn-green text-white px-8 py-3 rounded font-semibold hover:opacity-90 transition">Send</button>
            </form>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="cryptoBundle.js"></script>
    <script src="app.js"></script>
</body>
</html>
